server:
  port: 8081

spring:
  application:
    name: financeflow-identity-service

  datasource:
    url: jdbc:postgresql://localhost:5432/financeflow_identity
    username: mayank
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    private-key-location: ${JWT_PRIVATE_KEY_LOCATION}
    key-id: ${JWT_KEY_ID}
    additional-public-keys: ${JWT_ADDITIONAL_PUBLIC_KEYS:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO